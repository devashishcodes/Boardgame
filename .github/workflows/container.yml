name: CI Checks

# CI: clean ws -> checkout -> cred scan -> compile -> unit test -> SonarQube(Cloud)
#     -> docker build -> Trivy scan -> docker push -> Slack
on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "**.md"
  workflow_dispatch:
  workflow_call: # staging.yml yaha se reuse karta hai
    inputs:
      environment:
        type: string
        default: ci
    outputs:
      image_tag:
        description: "Pushed image tag"
        value: ${{ jobs.ci.outputs.image_tag }}

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/boardgame
  PUSH_IMAGE: ${{ github.event_name != 'pull_request' }} # PR par image push nahi hoti

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Clean workspace
        run: |
          shopt -s dotglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks history + sonar blame

      - name: Image metadata
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ---- Credential scanning (report artifact me) ----
      - name: Credential scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      # ---- Compile ----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile
        run: ./mvnw --batch-mode --no-transfer-progress compile

      # ---- Unit test (report) ----
      - name: Unit tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      # ---- SonarQube (config: sonar-project.properties / pom) ----
      - name: SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw --batch-mode --no-transfer-progress verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=devashishcodes
          -Dsonar.projectKey=devashishcodes_Boardgame
          -Dsonar.projectName=Boardgame
          -Dsonar.qualitygate.wait=true

      - name: Upload Sonar report info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: target/sonar/report-task.txt
          if-no-files-found: warn
          retention-days: 14

      # ---- Docker build ----
      - name: Docker build
        run: |
          docker build \
            -t "$IMAGE_NAME:${{ steps.meta.outputs.tag }}" \
            -t "$IMAGE_NAME:latest" .

      # ---- Trivy scan (HIGH/CRITICAL pe fail, report artifact) ----
      - name: Trivy image scan
        run: |
          mkdir -p trivy-report && chmod 777 trivy-report
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-report:/report" \
            aquasec/trivy:latest image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              --output /report/trivy-report.txt \
              "$IMAGE_NAME:${{ steps.meta.outputs.tag }}"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report/
          if-no-files-found: warn
          retention-days: 14

      # ---- Docker push (PR par nahi) ----
      - name: Docker Hub login
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker push
        if: env.PUSH_IMAGE == 'true'
        run: |
          docker push "$IMAGE_NAME:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE_NAME:latest"

      # ---- Slack: CI status + report link ----
      - name: Slack notification
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} *CI Checks ${{ job.status }}* | repo: ${{ github.repository }} | branch: ${{ github.ref_name }} | commit: ${{ github.sha }} | env: ${{ inputs.environment || 'ci' }}\nReports (gitleaks, unit test, sonar, trivy): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

name: Terraform Infra

# Poora AWS infra Terraform se: fmt -> validate -> plan -> (approval) apply / destroy.
# Runner: repo variable RUNNER_LABELS (JSON). Khali = GitHub-hosted (ubuntu-latest).
# Pritunl VPN ke andar chalane ke liye: RUNNER_LABELS = ["self-hosted","linux","pritunl"]
on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        options: [production, staging]
        default: production
      action:
        description: "Action"
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  id-token: write # AWS OIDC

concurrency:
  group: terraform-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.11.4"
  TF_ENV: ${{ inputs.environment || 'production' }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: ap-south-1

defaults:
  run:
    working-directory: terraform

jobs:
  plan:
    name: Plan
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick state key and var-file
        id: cfg
        run: |
          if [ "$TF_ENV" = "production" ]; then
            echo "key=boardgame/terraform.tfstate" >> "$GITHUB_OUTPUT"   # existing key
            echo "varfile=terraform.tfvars" >> "$GITHUB_OUTPUT"
          else
            echo "key=boardgame/${TF_ENV}/terraform.tfstate" >> "$GITHUB_OUTPUT"
            echo "varfile=envs/${TF_ENV}.tfvars" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend-config="key=${{ steps.cfg.outputs.key }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          if [ "${{ inputs.action }}" = "destroy" ]; then
            terraform plan -destroy -var-file="${{ steps.cfg.outputs.varfile }}" -no-color -out=tfplan
          else
            terraform plan -var-file="${{ steps.cfg.outputs.varfile }}" -no-color -out=tfplan
          fi

      - name: Plan summary
        run: |
          {
            echo '### Terraform plan (`'"${TF_ENV}"'`)'
            echo '```'
            terraform show -no-color tfplan | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENV }}
          path: terraform/tfplan
          retention-days: 3

  apply:
    name: Apply
    needs: plan
    # Apply SIRF manual: Actions -> Terraform Infra -> Run workflow -> action = apply.
    # PR / main push par sirf plan chalta hai (auto-apply nahi).
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'plan'
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '["ubuntu-latest"]') }}
    # GitHub Environment par "Required reviewers" laga do => manual approval
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick state key
        id: cfg
        run: |
          if [ "$TF_ENV" = "production" ]; then
            echo "key=boardgame/terraform.tfstate" >> "$GITHUB_OUTPUT"
          else
            echo "key=boardgame/${TF_ENV}/terraform.tfstate" >> "$GITHUB_OUTPUT"
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.TF_ENV }}
          path: terraform

      - name: Terraform init
        run: terraform init -backend-config="key=${{ steps.cfg.outputs.key }}"

      - name: Terraform apply
        run: terraform apply -no-color tfplan

      - name: Outputs
        run: terraform output

name: CI Checks

# CI: clean ws -> checkout -> cred scan -> compile -> unit test -> SonarQube(Cloud)
#     -> docker build -> Trivy scan -> docker push -> detailed report (Slack + run summary)
on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "**.md"
  workflow_dispatch:
  workflow_call: # staging.yml yaha se reuse karta hai
    inputs:
      environment:
        type: string
        default: ci
    outputs:
      image_tag:
        description: "Pushed image tag"
        value: ${{ jobs.ci.outputs.image_tag }}

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/boardgame
  PUSH_IMAGE: ${{ github.event_name != 'pull_request' }} # PR par image push nahi hoti

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Clean workspace
        run: |
          shopt -s dotglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks history + sonar blame

      - name: Image metadata
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ---- Credential scanning (report artifact me) ----
      - name: Credential scan (gitleaks)
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

      # ---- Compile ----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile
        id: compile
        run: ./mvnw --batch-mode --no-transfer-progress compile

      # ---- Unit test (report) ----
      - name: Unit tests
        id: tests
        run: ./mvnw --batch-mode --no-transfer-progress test

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      # ---- SonarQube (config: sonar-project.properties / pom) ----
      - name: SonarQube analysis
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw --batch-mode --no-transfer-progress verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=devashishcodes
          -Dsonar.projectKey=devashishcodes_Boardgame
          -Dsonar.projectName=Boardgame
          -Dsonar.qualitygate.wait=${{ vars.SONAR_QUALITY_GATE_WAIT || 'false' }}

      - name: Upload Sonar report info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: target/sonar/report-task.txt
          if-no-files-found: warn
          retention-days: 14

      # ---- Docker build ----
      - name: Docker build
        id: build
        run: |
          docker build \
            -t "$IMAGE_NAME:${{ steps.meta.outputs.tag }}" \
            -t "$IMAGE_NAME:latest" .

      # ---- Trivy scan (report hamesha; fail sirf jab repo variable TRIVY_FAIL=true) ----
      - name: Trivy image scan
        id: trivy
        run: |
          mkdir -p trivy-report trivy-cache && chmod 777 trivy-report trivy-cache
          set +e
          # 1) JSON report (detailed Slack/summary iske data se banta hai) + exit code
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-report:/report" \
            -v "$PWD/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format json \
              --output /report/trivy.json \
              "$IMAGE_NAME:${{ steps.meta.outputs.tag }}"
          rc=$?
          # 2) Table report (same cache, DB dobara download nahi hota)
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/trivy-report:/report" \
            -v "$PWD/trivy-cache:/root/.cache/" \
            aquasec/trivy:latest image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --format table \
              --output /report/trivy-report.txt \
              "$IMAGE_NAME:${{ steps.meta.outputs.tag }}"
          set -e
          {
            echo '### Trivy scan (HIGH/CRITICAL)'
            echo '```'
            head -c 20000 trivy-report/trivy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Trivy ne HIGH/CRITICAL vulnerabilities payi (details: run Summary / trivy-report artifact)"
            if [ "${{ vars.TRIVY_FAIL }}" = "true" ]; then exit 1; fi
          fi

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report/
          if-no-files-found: warn
          retention-days: 14

      # ---- Docker push (PR par nahi) ----
      - name: Docker Hub login
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker push
        id: push
        if: env.PUSH_IMAGE == 'true'
        run: |
          docker push "$IMAGE_NAME:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE_NAME:latest"

      # ---- Detailed report: Slack message + run summary ----
      - name: Build CI report
        id: report
        if: always()
        continue-on-error: true
        env:
          OUT_GITLEAKS: ${{ steps.gitleaks.outcome }}
          OUT_COMPILE: ${{ steps.compile.outcome }}
          OUT_TESTS: ${{ steps.tests.outcome }}
          OUT_SONAR: ${{ steps.sonar.outcome }}
          OUT_BUILD: ${{ steps.build.outcome }}
          OUT_TRIVY: ${{ steps.trivy.outcome }}
          OUT_PUSH: ${{ steps.push.outcome }}
          JOB_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 .github/scripts/ci_report.py

      # ---- Slack: detailed multi-line CI report ----
      - name: Slack notification
        if: always()
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: ${{ toJSON(steps.report.outputs.text || format('CI Checks {0} | {1} | {2}/{3}/actions/runs/{4}', job.status, github.repository, github.server_url, github.repository, github.run_id)) }}
